[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kairo-desktop"
version = "0.1.0"
description = "KAIRO voice presence and permission-scoped engineering agent"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1", "mcp==1.30.0", "pdfplumber==0.11.10", "google-genai==2.24.0", "sounddevice==0.5.6", "numpy==2.5.3"]

[project.scripts]
kairo-cli = "kairo.cli:main"

[project.optional-dependencies]
native = ["pywebview>=6,<7"]
companion = ["pyautogui>=0.9.54,<1", "Pillow>=11,<13"]
test = ["pytest>=8,<10"]

[project.gui-scripts]
KAIRO = "kairo.cli:main"

[tool.setuptools.package-data]
kairo = ["*.ps1", "*.html", "default.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
